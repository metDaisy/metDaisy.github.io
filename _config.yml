title: met Daisy
description: DEV_DAIRY

theme: jekyll-theme-hacker

collections:
    notes:
        output: true
        permalink: /:name/

plugins:
    - jekyll-seo-tag

sass:
    quiet_deps: true

# GitHub Pages 프로젝트 사이트로 사용할 경우 필요하면 설정하세요.
url: "https://metDaisy.github.io"
baseurl: ""

defaults:
    - scope:
          path: ""
          type: posts
      values:
          layout: post
    - scope:
          path: ""
          type: notes
      values:
          layout: post
