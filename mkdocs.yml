site_name: Hermes Agent Docs 번역
site_url: https://metdaisy.github.io/hermes-ko-docs/

# The Markdown source is checked out from the private content repository by CI.
docs_dir: draft-storage/hermes-docs

# Material for MkDocs is independent of the blog's Jekyll theme.
theme:
  name: material
  custom_dir: overrides

  font:
    # JetBrains Mono family를 본문/UI와 코드 영역에 적용
    text: JetBrains Mono
    code: JetBrains Mono

  palette:
    # 라이트 모드
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환

    # 다크 모드
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

use_directory_urls: true
