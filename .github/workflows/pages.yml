name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 매일 한국 시간 09:00 (UTC 00:00)에 Notion 변경 사항 확인
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [draft_update]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  JEKYLL_ENV: production
  JETBRAINS_MONO_VERSION: v2.304

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout private draft repository
        uses: actions/checkout@v6
        with:
          repository: metDaisy/github-page-draft-storage
          token: ${{ secrets.DRAFT_REPO_TOKEN }}
          path: draft-storage
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Restore JetBrains Mono cache
        id: font-cache
        uses: actions/cache@v5
        with:
          path: assets/fonts
          key: ${{ runner.os }}-jetbrains-mono-${{ env.JETBRAINS_MONO_VERSION }}

      - name: Download JetBrains Mono
        if: steps.font-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          for weight in Regular Bold; do
            curl --fail --location --retry 3 \
              --output "assets/fonts/JetBrainsMono-${weight}.woff2" \
              "https://raw.githubusercontent.com/JetBrains/JetBrainsMono/${JETBRAINS_MONO_VERSION}/fonts/webfonts/JetBrainsMono-${weight}.woff2"
          done
          curl --fail --location --retry 3 \
            --output assets/fonts/OFL.txt \
            "https://raw.githubusercontent.com/JetBrains/JetBrainsMono/${JETBRAINS_MONO_VERSION}/OFL.txt"

      - name: Import draft Markdown
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          rm -f _notes/*.md
          source_dir="draft-storage"
          for candidate in draft-storage/posts draft-storage/_notes draft-storage/_posts; do
            if [[ -d "$candidate" ]]; then
              source_dir="$candidate"
              break
            fi
          done

          imported=0
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            [[ "$name" == "README.md" ]] && continue
            cp "$file" "_notes/$name"
            imported=$((imported + 1))
          done < <(find "$source_dir" -maxdepth 1 -type f -name '*.md' -print0)

          if (( imported == 0 )); then
            echo "No Markdown posts found in $source_dir" >&2
            exit 1
          fi
          echo "Imported $imported Markdown post(s) from $source_dir"

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
