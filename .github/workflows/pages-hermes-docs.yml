name: Build and deploy GitHub Pages (Hermes docs)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-hermes-docs.yml'
      - 'mkdocs.yml'
      - 'scripts/generate_mkdocs_nav.py'
      - 'scripts/mkdocs_hooks.py'
  repository_dispatch:
    types: [hermes_docs_update]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  JEKYLL_ENV: production
  JETBRAINS_MONO_VERSION: v2.304

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout private draft repository
        uses: actions/checkout@v6
        with:
          repository: metDaisy/github-page-draft-storage
          token: ${{ secrets.DRAFT_REPO_TOKEN }}
          path: draft-storage
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Restore JetBrains Mono cache
        id: font-cache
        uses: actions/cache@v5
        with:
          path: assets/fonts
          key: ${{ runner.os }}-jetbrains-mono-${{ env.JETBRAINS_MONO_VERSION }}

      - name: Download JetBrains Mono
        if: steps.font-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          for weight in Regular Bold; do
            curl --fail --location --retry 3 \
              --output "assets/fonts/JetBrainsMono-${weight}.woff2" \
              "https://raw.githubusercontent.com/JetBrains/JetBrainsMono/${JETBRAINS_MONO_VERSION}/fonts/webfonts/JetBrainsMono-${weight}.woff2"
          done
          curl --fail --location --retry 3 \
            --output "assets/fonts/OFL.txt" \
            "https://raw.githubusercontent.com/JetBrains/JetBrainsMono/${JETBRAINS_MONO_VERSION}/OFL.txt"

      - name: Import dev-diary Markdown
        run: python scripts/import_draft_posts.py --source draft-storage --destination _notes

      - name: Build dev diary with Jekyll
        run: bundle exec jekyll build --destination ./_site

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: python -m pip install --disable-pip-version-check "mkdocs>=1.6,<2" mkdocs-material

      - name: Verify Hermes documentation source
        shell: bash
        run: |
          set -euo pipefail
          test -d draft-storage/hermes-docs
          test -n "$(find draft-storage/hermes-docs -type f -name '*.md' -print -quit)"

      - name: Generate MkDocs navigation
        run: >-
          python scripts/generate_mkdocs_nav.py
          --config ./mkdocs.yml
          --docs-dir ./draft-storage/hermes-docs
          --output ./.mkdocs.generated.yml

      - name: Build Hermes Korean documentation
        run: >-
          mkdocs build
          --strict
          --config-file ./.mkdocs.generated.yml
          --site-dir ./_site/hermes-ko-docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
